<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5f2">
  <title>我的生活小工具</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(150deg,#fbf9f7,#f0eee9);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:#263340}
    main{width:min(100%,440px);background:#fff;border:1px solid #eee8e1;border-radius:26px;padding:36px 27px;box-shadow:0 15px 48px #3333330b;text-align:center}
    .icon{font-size:52px;line-height:1.2;margin-bottom:14px}
    h1{font-size:27px;margin:0 0 12px}
    p{color:#6e7882;font-size:15px;line-height:1.75;margin:0 0 30px}
    a{display:block;background:#364f72;color:white;text-decoration:none;font-size:17px;font-weight:700;padding:17px 18px;border-radius:15px;transition:background .2s,transform .2s}
    a:hover{background:#273e5d;transform:translateY(-2px)}
    a:focus-visible{outline:3px solid #f2b95b;outline-offset:3px}
    small{display:block;margin-top:24px;color:#98a0a7;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🌤️👚</div>
    <h1>我的生活小工具</h1>
    <p>每天看氣溫，輕鬆選擇適合的穿搭。<br>使用 26 度穿衣法，快速計算保暖度。</p>
    <a href="./每日穿搭計算器.html">開啟每日穿搭計算器 →</a>
    <small>每日穿搭 · 簡單生活</small>
  </main>
</body>
</html>
