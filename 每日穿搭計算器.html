<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日穿搭計算器｜26度穿衣法</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#27332d;background:#f5f5ef}*{box-sizing:border-box}body{margin:0;padding:25px 15px}.wrap{max-width:640px;margin:auto}.eyebrow{font-size:12px;letter-spacing:.18em;color:#748277;font-weight:700}h1{margin:6px 0 8px;font-size:clamp(27px,6vw,37px)}.intro{color:#69766e;line-height:1.7;margin:0 0 22px}.panel{background:white;border:1px solid #e5e8df;border-radius:22px;padding:23px;box-shadow:0 10px 35px #3344330c;margin-bottom:16px}.line{display:flex;align-items:center;justify-content:space-between;gap:10px}.heading{font-size:17px;font-weight:700}.temperature{display:flex;align-items:center;gap:10px}.temp{font-size:32px;font-weight:750;min-width:94px;text-align:center;font-variant-numeric:tabular-nums}.round{width:38px;height:38px;border:1px solid #d8ded4;border-radius:50%;background:#f8faf7;font-size:24px;cursor:pointer;color:#40594b}input[type=range]{width:100%;accent-color:#698e73;margin:20px 0 5px}.ends{display:flex;justify-content:space-between;color:#8a948e;font-size:12px}.clothes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}.item{position:relative;border:1px solid #dfe5dc;border-radius:13px;padding:14px 12px;background:#fff;cursor:pointer;display:flex;justify-content:space-between;gap:8px;text-align:left;align-items:center;font:inherit;color:inherit;min-height:58px}.item.selected{border-color:#648d72;background:#edf5ed}.item .degrees{color:#567b61;font-weight:700;white-space:nowrap;font-size:14px}.item.selected:after{content:'✓';position:absolute;right:8px;top:-8px;background:#648d72;color:white;border-radius:100%;width:17px;height:17px;text-align:center;font-size:12px}.result{text-align:center;background:#e9f2e9;padding:26px 14px;border-radius:16px;margin-top:18px}.result .label{color:#61796a;font-size:13px}.formula{font-size:clamp(25px,6.5vw,36px);font-weight:800;margin:8px 0;font-variant-numeric:tabular-nums}.status{font-size:16px;font-weight:750}.hint{font-size:14px;color:#65746a;margin:9px auto 0;max-width:380px;line-height:1.6}.actions{display:flex;gap:10px;margin-top:16px}.btn{flex:1;padding:13px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer;border:1px solid #becfc0;background:#fff;color:#486a51}.btn.primary{background:#557c60;color:white;border-color:#557c60}.note{color:#768077;line-height:1.75;font-size:13px;padding:2px 5px 20px}@media(max-width:390px){.panel{padding:17px}.item{padding:12px 9px;font-size:14px}.temp{font-size:26px;min-width:75px}}
 .advice-panel{padding:0;overflow:hidden}.advice-panel .advice{margin-top:0;border:0;border-radius:22px}.advice{background:#f3f7f1;border:1px solid #dce9dc;border-radius:16px;padding:17px;margin-top:16px}.advice h2{font-size:17px;margin:0 0 9px}.advice p{margin:7px 0;color:#52685b;line-height:1.7;font-size:14px}.weather-extra{font-size:13px;color:#718476;margin-top:6px} .weatherbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px}.weatherinfo{font-size:13px;color:#607468;line-height:1.5}.weatherinfo.error{color:#a05a38}.refresh{border:1px solid #cbdccc;border-radius:9px;background:#f2f7f1;color:#3e6549;padding:9px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.refresh:disabled{opacity:.55;cursor:wait}.source{font-size:12px;color:#8b988e;margin-top:6px} </style>
</head>
<body><main class="wrap"><div class="eyebrow">DAILY OUTFIT PLANNER</div><h1>每日穿搭計算器 ☀️</h1><p class="intro">使用「26 度穿衣法」做穿搭參考：當日氣溫＋衣服保暖度 ≈ 26°C。</p>
<section class="panel"><div class="line"><div class="heading">🌡️ 今天的氣溫</div><div class="temperature"><button class="round" id="minus" aria-label="減少一度">−</button><span class="temp" id="temperature">23°C</span><button class="round" id="plus" aria-label="增加一度">+</button></div></div><input type="range" id="range" min="-10" max="40" value="23" aria-label="今日氣溫"><div class="ends"><span>−10°C</span><span>40°C</span></div><div class="weatherbar"><div id="weatherinfo" class="weatherinfo" role="status">📍 台北市大同區｜正在取得即時氣溫…</div><button id="refresh" class="refresh" type="button">↻ 重新取得氣溫</button></div><div class="source">氣溫來源：Open-Meteo（大同區附近座標，非街道實測）</div></section>
<section class="panel advice-panel"><div class="advice" aria-live="polite"><h2>✨ 今日穿衣建議</h2><p id="outfitAdvice">正在準備建議…</p><p id="weatherExtra" class="weather-extra"></p></div></section>
<section class="panel"><div class="heading">👚 今天想穿哪些衣服？</div><div id="clothes" class="clothes"></div><div class="result" aria-live="polite"><div class="label">氣溫 ＋ 衣服保暖度</div><div class="formula" id="formula">23 + 3 = 26°C</div><div id="status" class="status"></div><p id="hint" class="hint"></p></div><div class="actions"><button class="btn" id="reset">重新設定</button><button class="btn primary" id="copy">複製今天穿搭</button></div></section>
<p class="note">💡 提醒：26 度穿衣法是非科學驗證的網路穿搭口訣，衣物的實際保暖效果會受到材質、厚度、風、濕度和活動量影響；這些「度數」並非實際增溫值。寒冷或風大的天氣請以實際體感與防風保暖為主。</p></main>
<script>
const items=[['薄長袖',1],['襯衫',2],['薄外套',2],['針織衫',3],['厚毛衣',4],['風衣',5],['發熱衣',6],['輕羽絨',6],['毛呢大衣',7],['厚羽絨',9]];
let temp=23;let lastWeatherTemp=null;let wind=null;let rain=null;let hasWeather=false;let chosen=new Set(['薄長袖','薄外套']);
const $=id=>document.getElementById(id);const list=$('clothes');
items.forEach(([name,value])=>{const b=document.createElement('button');b.className='item';b.type='button';b.setAttribute('aria-pressed','false');b.innerHTML=`<span>${name}</span><span class="degrees">+${value}°</span>`;b.addEventListener('click',()=>{chosen.has(name)?chosen.delete(name):chosen.add(name);draw()});b.dataset.name=name;list.append(b)});
function draw(){updateAdvice();const sum=items.reduce((acc,[name,v])=>acc+(chosen.has(name)?v:0),0),result=temp+sum;$('temperature').textContent=`${temp}°C`;$('range').value=temp;$('formula').textContent=`${temp} + ${sum} = ${result}°C`;for(const b of list.children){const yes=chosen.has(b.dataset.name);b.classList.toggle('selected',yes);b.setAttribute('aria-pressed',String(yes))}const status=$('status'),hint=$('hint');if(result>=25&&result<=27){status.textContent='✓ 接近 26°C 目標';status.style.color='#3f8054';hint.textContent='依照這個穿衣口訣，目前的搭配剛剛好。'}else if(result<25){status.textContent='可能偏冷 🧣';status.style.color='#4e7892';hint.textContent='可以考慮增加一件保暖衣物，或換成較厚的外套。'}else{status.textContent='可能偏熱 ☀️';status.style.color='#b57444';hint.textContent='可以考慮減少一層，或換成較薄的衣物。'}}
function updateAdvice(){
 const advice=$('outfitAdvice'),extra=$('weatherExtra');
 let outfits;
 if(temp>=29)outfits='短袖、透氣長褲或短褲；外出注意防曬及補水。';
 else if(temp>=25)outfits='短袖或薄上衣，搭配透氣長褲；怕冷可帶一件薄罩衫應付冷氣房。';
 else if(temp>=22)outfits='薄長袖或短袖加薄外套，搭配長褲；早晚可穿上外套。';
 else if(temp>=19)outfits='薄長袖加針織外套或薄風衣，搭配長褲。';
 else if(temp>=15)outfits='長袖加毛衣或中厚外套，搭配長褲；早晚注意保暖。';
 else if(temp>=10)outfits='發熱衣或長袖內搭，加毛衣及厚外套；需要時加圍巾。';
 else outfits='保暖內搭、毛衣、厚羽絨外套和長褲；可加圍巾、帽子及手套。';
 let notices=[];
 if(wind!==null && wind>=25)notices.push('風較大，建議加防風外套');
 if(rain!==null && rain>0)notices.push('目前有降水，外出記得帶傘或雨衣');
 advice.textContent=`以 ${temp}°C 為參考：${outfits}${notices.length?' '+notices.join('；')+'。':''}`;
 extra.textContent=hasWeather?`大同區附近天氣參考：風速 ${wind===null?'未知':wind.toFixed(0)+' km/h'}${rain===null?'':'｜目前降水 '+rain+' mm'}。穿搭仍請依體感調整。`:'尚未取得當地天氣資料；以上依畫面顯示的氣溫建議。';
}
function manualTemp(v){temp=Math.max(-10,Math.min(40,v));draw();$('weatherinfo').textContent='📍 台北市大同區｜目前為手動調整溫度';$('weatherinfo').classList.remove('error')}
async function fetchWeather(){const b=$('refresh'),info=$('weatherinfo');b.disabled=true;info.classList.remove('error');info.textContent='📍 台北市大同區｜正在取得即時氣溫…';try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);let response;try{response=await fetch('https://api.open-meteo.com/v1/forecast?latitude=25.063&longitude=121.513&current=temperature_2m,wind_speed_10m,precipitation&timezone=Asia%2FTaipei',{signal:controller.signal,cache:'no-store'})}finally{clearTimeout(timer)}if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();const value=data?.current?.temperature_2m;if(typeof value!=='number'||!Number.isFinite(value))throw new Error('No valid temperature');lastWeatherTemp=value;wind=typeof data.current.wind_speed_10m==='number'?data.current.wind_speed_10m:null;rain=typeof data.current.precipitation==='number'?data.current.precipitation:null;hasWeather=true;temp=Math.max(-10,Math.min(40,Math.round(value)));draw();const observation=data.current.time?data.current.time.replace('T',' '):'時間未知';info.textContent=`📍 台北市大同區｜${value.toFixed(1)}°C（資料時間：${observation}）`; }catch(e){info.classList.add('error');info.textContent='⚠️ 無法取得即時氣溫，請檢查網路後重試；目前顯示的是手動／預設溫度。'}finally{b.disabled=false}}
$('refresh').onclick=fetchWeather;
$('minus').onclick=()=>manualTemp(temp-1);$('plus').onclick=()=>manualTemp(temp+1);$('range').oninput=e=>manualTemp(Number(e.target.value));$('reset').onclick=()=>{chosen=new Set(['薄長袖','薄外套']);if(lastWeatherTemp===null){temp=23;draw()}else{temp=Math.max(-10,Math.min(40,Math.round(lastWeatherTemp)));draw()}fetchWeather()};$('copy').onclick=async()=>{const v=items.filter(([name])=>chosen.has(name)).map(([name])=>name).join('、')||'未選衣物';const msg=`今日氣溫：${temp}°C\n穿搭：${v}\n26度穿衣法計算：${$('formula').textContent}`;try{await navigator.clipboard.writeText(msg);$('copy').textContent='✓ 已複製';setTimeout(()=>$('copy').textContent='複製今天穿搭',1600)}catch{prompt('複製以下穿搭內容：',msg)}};draw();fetchWeather();
</script></body></html>
